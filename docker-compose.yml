services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: event_agent
      POSTGRES_USER: event_agent
      POSTGRES_PASSWORD: event_agent
    ports:
      - "5433:5432"
    volumes:
      - event_agent_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U event_agent -d event_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - event_agent_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  event_agent_postgres:
  event_agent_redis:
